<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoDesk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Custom titlebar (frameless window) -->
  <div id="titlebar">
    <div id="titlebar-drag">
      <span id="app-name">CRYPTODESK</span>
    </div>
    <div id="titlebar-controls">
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button id="btn-max" title="Maximize">&#9633;</button>
      <button id="btn-close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- Tab bar -->
  <nav id="tabs">
    <button class="tab active" data-tab="charts">Charts</button>
    <button class="tab" data-tab="assets">OKX Assets</button>
    <button class="tab" data-tab="loans">OKX Loans</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>

  <!-- Charts tab -->
  <div id="tab-charts" class="tab-content active">

    <div id="toolbar">
      <div class="toolbar-group">
        <label>Exchange</label>
        <select id="sel-exchange">
          <option value="binance">Binance</option>
          <option value="okx">OKX</option>
        </select>
      </div>
      <div class="toolbar-group">
        <label>Symbol</label>
        <input id="inp-symbol" type="text" value="BTCUSDT" spellcheck="false" />
      </div>
      <div class="toolbar-group">
        <label>Interval</label>
        <select id="sel-interval">
          <option value="1m">1m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
          <option value="1h">1h</option>
          <option value="4h">4h</option>
          <option value="1d" selected>1d</option>
        </select>
      </div>
      <button id="btn-load">Load</button>
      <span id="status-msg"></span>
      <div id="market-indicators">
        <div class="market-item">
          <span class="market-label">BTC.D</span>
          <span id="val-btcd">--</span>
        </div>
        <span class="market-sep">|</span>
        <div class="market-item">
          <span class="market-label">F&amp;G</span>
          <span id="val-fg">--</span>
          <span id="val-fg-word"></span>
        </div>
        <span id="market-live-dot" hidden></span>
      </div>
    </div>

    <div id="chart-container"></div>

  </div>

  <!-- OKX Assets tab -->
  <div id="tab-assets" class="tab-content">

    <div id="assets-no-keys" hidden>
      <p>Configure OKX API keys in <button id="btn-assets-goto-settings" class="btn-link">Settings</button></p>
    </div>

    <div id="assets-main" hidden>
      <div id="assets-columns">

        <!-- Funding column -->
        <div class="assets-col">
          <div class="assets-col-header">
            <span class="assets-col-title">FUNDING</span>
            <span class="assets-badge" id="funding-count">0</span>
            <button id="btn-refresh-assets" title="Refresh">&#8635;</button>
          </div>
          <label class="assets-filter">
            <input type="checkbox" id="chk-hide-zero-funding" checked />
            <span>Hide zero balances</span>
          </label>
          <div class="assets-table-wrap">
            <table class="assets-table">
              <thead>
                <tr>
                  <th>Asset</th>
                  <th>Balance</th>
                  <th>Available</th>
                  <th>Frozen</th>
                </tr>
              </thead>
              <tbody id="funding-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Trading column -->
        <div class="assets-col">
          <div class="assets-col-header">
            <span class="assets-col-title">TRADING</span>
            <span class="assets-badge" id="trading-count">0</span>
          </div>
          <label class="assets-filter">
            <input type="checkbox" id="chk-hide-zero-trading" checked />
            <span>Hide zero balances</span>
          </label>
          <div class="assets-table-wrap">
            <table class="assets-table">
              <thead>
                <tr>
                  <th>Asset</th>
                  <th>Equity</th>
                  <th>Available</th>
                  <th>Frozen</th>
                </tr>
              </thead>
              <tbody id="trading-tbody"></tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- Transfer panel — always in DOM, toggled with .open -->
      <div id="transfer-panel">
        <div id="transfer-panel-inner">
          <span id="transfer-ccy"></span>
          <button id="btn-transfer-dir">Funding &#x21c4; Trading</button>
          <input id="inp-transfer-amt" type="text" inputmode="decimal" placeholder="Amount" />
          <div id="transfer-pct-btns">
            <button class="btn-pct" data-pct="0.02">2%</button>
            <button class="btn-pct" data-pct="0.05">5%</button>
            <button class="btn-pct" data-pct="0.10">10%</button>
            <button class="btn-pct" data-pct="0.50">50%</button>
            <button class="btn-pct" data-pct="0.999">99.9%</button>
            <button class="btn-pct" data-pct="1.00">100%</button>
          </div>
          <button id="btn-transfer-confirm">Transfer</button>
          <span id="transfer-msg"></span>
          <button id="btn-transfer-close">&#10005;</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Loans tab -->
  <div id="tab-loans" class="tab-content">

    <!-- Shown when OKX keys are not configured -->
    <div id="loans-no-keys" hidden>
      <p>Configure OKX API keys in <button id="btn-goto-settings" class="btn-link">Settings</button></p>
    </div>

    <!-- Main content (shown when keys are present) -->
    <div id="loans-main" hidden>
      <div id="loans-summary-wrap">
        <button id="btn-refresh-loans">Refresh</button>
        <div id="loans-summary">
          <div class="metric-card">
            <span class="metric-label">Total Borrowed</span>
            <span id="val-total-borrowed" class="metric-value">--</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Total Collateral</span>
            <span id="val-total-collateral" class="metric-value">--</span>
          </div>
          <div class="metric-card">
            <span class="metric-label">Active Loans</span>
            <span id="val-active-loans" class="metric-value">--</span>
          </div>
        </div>
      </div>
      <div id="loans-list"></div>
    </div>

  </div>

  <!-- Settings tab -->
  <div id="tab-settings" class="tab-content">
    <div id="settings-pane">
      <h3 class="settings-heading">API Keys</h3>
      <div class="settings-row">
        <span class="settings-label">CMC API KEY</span>
        <input id="inp-cmc-key" type="password" spellcheck="false" placeholder="Enter CoinMarketCap API key" />
        <button class="btn-show-hide" data-target="inp-cmc-key">Show</button>
        <button id="btn-save-cmc" class="btn-save">Save</button>
        <span id="conf-cmc" class="save-confirm"></span>
      </div>
      <div class="settings-row">
        <span class="settings-label">OKX API KEY</span>
        <input id="inp-okx-key" type="password" spellcheck="false" placeholder="Enter OKX API key" />
        <button class="btn-show-hide" data-target="inp-okx-key">Show</button>
        <button id="btn-save-okx-key" class="btn-save">Save</button>
        <span id="conf-okx-key" class="save-confirm"></span>
      </div>
      <div class="settings-row">
        <span class="settings-label">OKX SECRET</span>
        <input id="inp-okx-secret" type="password" spellcheck="false" placeholder="Enter OKX secret" />
        <button class="btn-show-hide" data-target="inp-okx-secret">Show</button>
        <button id="btn-save-okx-secret" class="btn-save">Save</button>
        <span id="conf-okx-secret" class="save-confirm"></span>
      </div>
      <div class="settings-row">
        <span class="settings-label">OKX PASSPHRASE</span>
        <input id="inp-okx-passphrase" type="password" spellcheck="false" placeholder="Enter OKX passphrase" />
        <button class="btn-show-hide" data-target="inp-okx-passphrase">Show</button>
        <button id="btn-save-okx-passphrase" class="btn-save">Save</button>
        <span id="conf-okx-passphrase" class="save-confirm"></span>
      </div>
    </div>
  </div>

  <!-- Bundle lightweight-charts from CDN, then app logic -->
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
